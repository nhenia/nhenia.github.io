<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0c0b">
<title>Overlie</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0d0c0b;--ink:#ede6da;--dim:#8a8378;--line:#2b2825;--acc:#e8ff5a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font:13px/1.3 ui-monospace,Menlo,Consolas,monospace;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;padding-top:env(safe-area-inset-top)}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;background:#000}
#cam{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{display:none}
#msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:32px;color:var(--dim);pointer-events:none}
#msg b{display:block;font:italic 700 34px/1 Georgia,serif;color:var(--ink);letter-spacing:-.02em;margin-bottom:10px}
#add{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--acc);color:#111;font:700 16px/1 ui-monospace,Menlo,monospace;padding:18px 26px;border-radius:99px;border:0;cursor:pointer;box-shadow:0 6px 30px rgba(0,0,0,.5);display:flex;align-items:center}
#add input{display:none}
#ver{position:absolute;right:10px;bottom:8px;font-size:10px;color:rgba(237,230,218,.45);pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
#top>*{pointer-events:auto}
.chip{background:rgba(13,12,11,.85);border:1px solid rgba(237,230,218,.18);color:var(--ink);border-radius:99px;padding:8px 12px;font:inherit;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);color:#111;border-color:var(--acc)}
#bar{border-top:1px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:grid;gap:12px}
.slide{display:grid;grid-template-columns:64px 1fr 44px;align-items:center;gap:10px;color:var(--dim)}
.slide output{text-align:right;color:var(--ink)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line)}
input[type=range]::-moz-range-track{height:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--ink);margin-top:-10px}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--ink);border:0}
.row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;height:44px;border:1px solid var(--line);border-radius:12px;color:var(--ink);background:none;font:inherit;cursor:pointer}
.btn input{display:none}
#shoot{width:72px;height:72px;border-radius:50%;border:3px solid var(--ink);background:none;padding:5px;cursor:pointer}
#shoot span{display:block;width:100%;height:100%;border-radius:50%;background:var(--ink);transition:transform .1s}
#shoot:active span{transform:scale(.88);background:var(--acc)}
#shoot:disabled{opacity:.3}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;flex-direction:column;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));gap:12px;z-index:5}
#sheet.on{display:flex}
#sheet img{flex:1;min-height:0;object-fit:contain;width:100%}
#sheet .row2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
#sheet .save{background:var(--acc);color:#111;border-color:var(--acc);font-weight:700}
</style>
</head>
<body>
<div id="stage">
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="view"></canvas>
  <img id="ov" alt="">
  <div id="msg"><div><b>Overlie</b><span id="msgtxt">Starting camera…</span></div></div>
  <label id="add">+ Add overlay photo<input id="pick2" type="file" accept="image/*"></label>
  <div id="ver">v3</div>
  <div id="flash"></div>
  <div id="top">
    <button class="chip" id="burn" aria-pressed="true" title="Include overlay in saved photo">Overlay in photo</button>
    <button class="chip" id="flip">Flip cam</button>
  </div>
</div>
<div id="bar">
  <label class="slide">Opacity<input id="op" type="range" min="0" max="100" value="50"><output id="opv">50%</output></label>
  <label class="slide">Size<input id="sz" type="range" min="10" max="300" value="100"><output id="szv">100%</output></label>
  <label class="slide">Rotate<input id="rt" type="range" min="-180" max="180" value="0"><output id="rtv">0°</output></label>
  <div class="row">
    <label class="btn">Photo<input id="pick" type="file" accept="image/*"></label>
    <button id="shoot" aria-label="Take photo"><span></span></button>
    <button class="btn" id="reset">Center</button>
  </div>
</div>
<div id="sheet">
  <img id="shot" alt="Captured photo">
  <div class="row2">
    <button class="btn" id="retake">Retake</button>
    <button class="btn" id="share">Share</button>
    <button class="btn save" id="save">Save</button>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const stage = $('stage'), cam = $('cam'), ov = $('ov');
let facing = 'environment', stream = null;
// overlay state in stage-relative units: centre (fraction), width (fraction of stage width)
const S = { cx: .5, cy: .5, w: 1, op: .5, r: 0 };
let lastBlob = null, lastURL = null;

async function startCam() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  if (!navigator.mediaDevices?.getUserMedia) {
    $('msg').style.display = '';
    $('msgtxt').textContent = 'This browser can\'t open the camera here. Open the link in Chrome itself (not inside another app).';
    return;
  }
  const tries = [
    { video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false },
    { video: { facingMode: { ideal: facing } }, audio: false },
    { video: true, audio: false }
  ];
  let err = null;
  for (const c of tries) {
    try { stream = await navigator.mediaDevices.getUserMedia(c); break; } catch (e) { err = e; }
  }
  if (!stream) {
    $('msg').style.display = '';
    $('msgtxt').textContent = (err && err.name === 'NotAllowedError')
      ? 'Camera blocked. Tap the lock icon by the address, allow Camera, then reload.'
      : 'Camera didn\'t start (' + (err ? err.name : 'unknown') + '). Close other camera apps and reload.';
    return;
  }
  cam.srcObject = stream;
  try { await cam.play(); } catch (e) {}
  $('msg').style.display = 'none';
}

// preview: camera + overlay painted together on one canvas (no stacked layers)
const view = $('view'), vx = view.getContext('2d');
let prev = null; // downscaled overlay for smooth preview; full-res ov is used for the saved photo
function render() {}
function makePrev() {
  const m = 1600, k = Math.min(1, m / Math.max(ov.naturalWidth, ov.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(ov.naturalWidth * k); c.height = Math.round(ov.naturalHeight * k);
  c.getContext('2d').drawImage(ov, 0, 0, c.width, c.height);
  prev = c;
}
function draw() {
  const W = stage.clientWidth, H = stage.clientHeight, d = Math.min(2, devicePixelRatio || 1);
  const pw = Math.round(W * d), ph = Math.round(H * d);
  if (view.width !== pw || view.height !== ph) { view.width = pw; view.height = ph; }
  vx.setTransform(d, 0, 0, d, 0, 0);
  vx.fillStyle = '#000'; vx.fillRect(0, 0, W, H);
  const vw = cam.videoWidth, vh = cam.videoHeight;
  if (vw && cam.readyState >= 2) {
    const s = Math.max(W / vw, H / vh), dw = vw * s, dh = vh * s;
    vx.save();
    if (facing === 'user') { vx.translate(W, 0); vx.scale(-1, 1); }
    vx.drawImage(cam, (W - dw) / 2, (H - dh) / 2, dw, dh);
    vx.restore();
  }
  if (prev) {
    const w = S.w * W, h = w * prev.height / prev.width;
    vx.save(); vx.globalAlpha = S.op;
    vx.translate(S.cx * W, S.cy * H); vx.rotate(S.r * Math.PI / 180);
    vx.drawImage(prev, -w / 2, -h / 2, w, h);
    vx.restore();
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
// Android pauses/kills the camera while the photo picker is open: bring it back
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const t = stream && stream.getVideoTracks()[0];
  if (!t || t.readyState === 'ended' || t.muted) startCam();
  else cam.play().catch(() => startCam());
});

const onPick = e => {
  const f = e.target.files[0]; if (!f) return;
  if (ov.src) URL.revokeObjectURL(ov.src);
  ov.onload = () => { makePrev(); resetOv(); };
  ov.src = URL.createObjectURL(f);
  e.target.value = '';
  $('add').style.display = 'none';
};
$('pick').onchange = onPick; $('pick2').onchange = onPick;
function resetOv() { S.cx = .5; S.cy = .5; S.w = 1; S.r = 0; $('rt').value = 0; $('rtv').textContent = '0°'; $('sz').value = 100; $('szv').textContent = '100%'; render(); }
$('reset').onclick = resetOv;
$('op').oninput = e => { S.op = e.target.value / 100; $('opv').textContent = e.target.value + '%'; render(); };
$('sz').oninput = e => { S.w = e.target.value / 100; $('szv').textContent = e.target.value + '%'; render(); };
$('rt').oninput = e => { S.r = +e.target.value; $('rtv').textContent = e.target.value + '°'; render(); };
$('flip').onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; startCam(); };
$('burn').onclick = e => e.currentTarget.setAttribute('aria-pressed', e.currentTarget.getAttribute('aria-pressed') !== 'true');

// drag with one finger, pinch with two
const pts = new Map(); let g = null;
function snap() {
  const p = [...pts.values()], W = stage.clientWidth, H = stage.clientHeight;
  if (p.length === 1) g = { x: p[0].x, y: p[0].y, cx: S.cx, cy: S.cy };
  else if (p.length >= 2) {
    const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
    g = { d, w: S.w, mx: (p[0].x + p[1].x) / 2, my: (p[0].y + p[1].y) / 2, cx: S.cx, cy: S.cy };
  }
}
stage.addEventListener('pointerdown', e => { if (e.target.closest('#top,#add')) return; stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); snap(); });
stage.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId) || !ov.naturalWidth) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const p = [...pts.values()], W = stage.clientWidth, H = stage.clientHeight;
  if (p.length === 1) { S.cx = g.cx + (p[0].x - g.x) / W; S.cy = g.cy + (p[0].y - g.y) / H; }
  else {
    const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
    S.w = Math.min(3, Math.max(.1, g.w * d / g.d));
    const mx = (p[0].x + p[1].x) / 2, my = (p[0].y + p[1].y) / 2;
    S.cx = g.cx + (mx - g.mx) / W; S.cy = g.cy + (my - g.my) / H;
    const pct = Math.round(S.w * 100); $('sz').value = pct; $('szv').textContent = pct + '%';
  }
  render();
});
const up = e => { pts.delete(e.pointerId); snap(); };
stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
// mouse wheel resize for desktop
stage.addEventListener('wheel', e => { e.preventDefault(); S.w = Math.min(3, Math.max(.1, S.w * (e.deltaY < 0 ? 1.05 : .95))); const pct = Math.round(S.w * 100); $('sz').value = pct; $('szv').textContent = pct + '%'; render(); }, { passive: false });
addEventListener('resize', render);

// capture: full-res camera frame, overlay mapped from screen (object-fit:cover) to frame pixels
$('shoot').onclick = () => {
  const vw = cam.videoWidth, vh = cam.videoHeight; if (!vw) return;
  const W = stage.clientWidth, H = stage.clientHeight;
  const s = Math.max(W / vw, H / vh), offX = (W - vw * s) / 2, offY = (H - vh * s) / 2;
  const c = document.createElement('canvas'); c.width = vw; c.height = vh;
  const x = c.getContext('2d');
  const mirror = facing === 'user';
  if (mirror) { x.translate(vw, 0); x.scale(-1, 1); }
  x.drawImage(cam, 0, 0, vw, vh);
  if (mirror) x.setTransform(1, 0, 0, 1, 0, 0);
  if (ov.naturalWidth && $('burn').getAttribute('aria-pressed') === 'true') {
    const w = S.w * W, h = w * ov.naturalHeight / ov.naturalWidth;
    x.save();
    x.globalAlpha = S.op;
    x.translate((S.cx * W - offX) / s, (S.cy * H - offY) / s);
    x.rotate(S.r * Math.PI / 180);
    x.drawImage(ov, -w / s / 2, -h / s / 2, w / s, h / s);
    x.restore();
  }
  $('flash').style.opacity = .8; setTimeout(() => $('flash').style.opacity = 0, 60);
  c.toBlob(b => {
    lastBlob = b; if (lastURL) URL.revokeObjectURL(lastURL);
    lastURL = URL.createObjectURL(b); $('shot').src = lastURL; $('sheet').classList.add('on');
  }, 'image/jpeg', .95);
};
const fname = () => 'overlie-' + new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19) + '.jpg';
$('retake').onclick = () => $('sheet').classList.remove('on');
$('save').onclick = () => { const a = document.createElement('a'); a.href = lastURL; a.download = fname(); document.body.appendChild(a); a.click(); a.remove(); };
$('share').onclick = async () => {
  const f = new File([lastBlob], fname(), { type: 'image/jpeg' });
  if (navigator.canShare?.({ files: [f] })) { try { await navigator.share({ files: [f] }); } catch (e) {} }
  else $('save').click();
};

startCam();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
