<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101015"><title>COMMA / SHIFT</title><style>:root{color-scheme:dark;font-family:ui-monospace,Menlo,Consolas,monospace}*{box-sizing:border-box}body{margin:0;background:#101015;color:#f0eee9;min-height:100vh;display:grid;place-items:center;padding:22px}main{width:min(100%,680px)}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #444;padding-bottom:18px;gap:12px}h1{font-size:clamp(26px,6vw,48px);letter-spacing:-2px;margin:0}small,.muted{color:#a6a4ae}h2{font-size:12px;color:#c2f36a;letter-spacing:2px;margin:42px 0 16px}textarea{width:100%;background:#1b1b23;border:1px solid #666;border-radius:8px;padding:20px;color:#fff;font:clamp(19px,4vw,30px)/1.5 ui-monospace,monospace;resize:vertical;min-height:150px}textarea:focus{outline:2px solid #c2f36a}button{font:inherit;cursor:pointer;background:#c2f36a;color:#111;border:0;border-radius:5px;padding:13px 17px;font-weight:800}button.secondary{background:#303039;color:#fff}button:focus-visible{outline:3px solid white;outline-offset:3px}.buttons{display:flex;flex-wrap:wrap;gap:9px;margin:15px 0}#examples{background:#1b1b23;padding:20px;border-left:3px solid #c2f36a;border-radius:4px;line-height:1.7}#examples p{margin:9px 0}#examples strong{color:#c2f36a}footer{margin-top:38px;font-size:12px;color:#a6a4ae}kbd{background:#333;padding:3px 6px;border-radius:3px}</style><main><header><h1>COMMA<span style="color:#c2f36a">/</span>SHIFT</h1><small>MEANING IS A MARK</small></header><h2>01 / REPOSITION THE COMMA</h2><p class="muted">Edit the punctuation. Change the meaning. The words stay the same.</p><textarea id="editor" spellcheck="false" aria-label="Edit sentence punctuation"></textarea><div class="buttons"><button id="next">↻ RANDOM SENTENCE</button><button class="secondary" id="reset">RESET</button><button class="secondary" id="reveal">SHOW TWO READINGS</button></div><div id="examples" hidden aria-live="polite"></div><footer><span id="count"></span> · No accounts, AI, or tracking. <kbd>Ctrl</kbd> + <kbd>Enter</kbd> for next.</footer></main><script>

];let current=-1;const editor=document.querySelector('#editor'),examples=document.querySelector('#examples'),count=document.querySelector('#count');function next(){let n=Math.floor(Math.random()*bank.length);if(bank.length>1&&n===current)n=(n+1)%bank.length;current=n;editor.value=bank[n][0];examples.hidden=true;count.textContent=bank.length+' curated ambiguity prompts';editor.focus()}document.querySelector('#next').onclick=next;document.querySelector('#reset').onclick=()=>{editor.value=bank[current][0];examples.hidden=true;editor.focus()};document.querySelector('#reveal').onclick=()=>{const x=bank[current];examples.innerHTML='<strong>READING A</strong><p></p><small></small><hr><strong>READING B</strong><p></p><small></small>';const p=examples.querySelectorAll('p'),s=examples.querySelectorAll('small');p[0].textContent=x[1];p[1].textContent=x[2];s[0].textContent=x[3];s[1].textContent=x[4];examples.hidden=!examples.hidden};document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();next()}});next();
