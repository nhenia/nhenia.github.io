plugins {
    id 'com.android.application'
}

android {
    namespace 'app.overlie'
    compileSdk 35

    defaultConfig {
        applicationId 'app.overlie'
        minSdk 24
        targetSdk 35
        // CI passes the run number so every build installs over the last one
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName '1.' + (System.getenv('VERSION_CODE') ?: '0')
    }

    signingConfigs {
        release {
            // Personal sideload key, kept in the repo on purpose (see android/README.md)
            storeFile file('../overlie.keystore')
            storePassword 'overlie-sideload'
            keyAlias 'overlie'
            keyPassword 'overlie-sideload'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
